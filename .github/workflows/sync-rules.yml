name: Sync & Probe Magnet Rules

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync & probe site rules
        run: python scripts/sync_rules.py --output rules/sites_live.json --report rules/sync_report.md

      - name: Commit updated rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/sites_live.json rules/sync_report.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(rules): auto-sync live magnet rules [skip ci]"
            git push
          else
            echo "No rule changes detected."
          fi
